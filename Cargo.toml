[package]
name = "piaskownica"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"] 

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
fastrand = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"