<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Piaskownica</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">
        <h1 class="app-title"><span>Piaskownica</span><span class="app-title-version">v1.1.0</span></h1>

        <section class="panel">
            <h2 class="panel-title">Materiały</h2>
            <ul class="material-list" id="materials">
                <li><button class="material-btn active" data-material="1"  style="--mat:#ffe400"><span class="swatch"></span><span class="mat-name">Piasek</span></button></li>
                <li><button class="material-btn"        data-material="2"  style="--mat:#2fbeff"><span class="swatch"></span><span class="mat-name">Woda</span></button></li>
                <li><button class="material-btn"        data-material="3"  style="--mat:#aba4a4"><span class="swatch"></span><span class="mat-name">Kamień</span></button></li>
                <li><button class="material-btn"        data-material="4"  style="--mat:#854a1e"><span class="swatch"></span><span class="mat-name">Drewno</span></button></li>
                <li><button class="material-btn"        data-material="5"  style="--mat:#ff6800"><span class="swatch"></span><span class="mat-name">Lawa</span></button></li>
                <li><button class="material-btn"        data-material="6"  style="--mat:#8c8c96"><span class="swatch"></span><span class="mat-name">Metal</span></button></li>
                <li><button class="material-btn"        data-material="7"  style="--mat:#78ffff"><span class="swatch"></span><span class="mat-name">Lód</span></button></li>
                <li><button class="material-btn"        data-material="8"  style="--mat:#c8d2dc"><span class="swatch"></span><span class="mat-name">Para</span></button></li>
                <li><button class="material-btn"        data-material="9"  style="--mat:#ff8c1e"><span class="swatch"></span><span class="mat-name">Ogień</span></button></li>
                <li><button class="material-btn"        data-material="10" style="--mat:#281e15"><span class="swatch swatch-bordered"></span><span class="mat-name">Olej</span></button></li>
                <li><button class="material-btn"        data-material="11" style="--mat:#0000c8"><span class="swatch"></span><span class="mat-name">Zimno</span></button></li>
                <li><button class="material-btn"        data-material="0"><span class="swatch swatch-eraser"></span><span class="mat-name">Nic</span></button></li>
            </ul>
        </section>

        <section class="panel">
            <h2 class="panel-title">Akcje</h2>
            <div class="action-list" id="snapshot-controls">
                <button id="pause-btn" class="action-btn"><span class="glyph"></span><span>Pauza</span></button>
                <button id="save-btn"  class="action-btn"><span class="glyph"></span><span>Zapisz</span></button>
                <button id="load-btn"  class="action-btn"><span class="glyph"></span><span>Wczytaj</span></button>
                <button id="clear-btn" class="action-btn"><span class="glyph"></span><span>Wyczyść</span></button>
            </div>
            <input type="file" id="load-input" accept=".json" style="display:none">
            <p id="snapshot-message" class="status-msg"></p>
        </section>
    </aside>

    <section class="stage">
        <div class="canvas-wrap">
            <canvas id="canvas"></canvas>
        </div>
        <footer class="statusbar">
            <span class="status-cell">
                <span class="status-k">Kursor</span>
                <span class="status-v" id="debug">(0, 0): 0°C</span>
            </span>
        </footer>
    </section>

</div>

<script type="module" src="index.js"></script>
</body>
</html>
